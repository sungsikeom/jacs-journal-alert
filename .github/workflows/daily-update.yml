name: Daily JACS update
# GitHub Pages enabled; this commit triggers the first Pages deployment.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-update.yml"
      - "scripts/**"
      - "index.html"
      - "app.js"
      - "styles.css"
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: journal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and verify JACS records
        id: update
        continue-on-error: true
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: |
          set -o pipefail
          python scripts/update_journals.py 2>&1 | tee /tmp/jacs-update.log

      - name: Report collection failure
        if: steps.update.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The ACS based JACS collection failed. Existing site data was preserved."
            echo
            echo '~~~text'
            tail -n 80 /tmp/jacs-update.log
            echo '~~~'
          } > /tmp/jacs-failure.md
          gh issue create --title "JACS collection failed · $(date -u +%F)" --body-file /tmp/jacs-failure.md

      - name: Stop after collection failure
        if: steps.update.outcome == 'failure'
        run: exit 1

      - name: Commit updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/seen_dois.json
          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "Update JACS metadata"
            git push
          fi

      - name: Create notification issue
        if: steps.update.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.update.outputs.new_count }}
          CHECKED_DATE: ${{ steps.update.outputs.checked_date }}
        run: gh issue create --title "JACS 신규 논문 ${NEW_COUNT}편 · ${CHECKED_DATE}" --body-file data/new_articles.md

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          mkdir _site/data
          cp data/articles.json _site/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
