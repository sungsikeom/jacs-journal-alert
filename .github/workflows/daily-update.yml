name: Daily journal update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-update.yml"
      - "scripts/**"
      - "data/**"
      - "index.html"
      - "app.js"
      - "styles.css"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: journal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site data from official publisher inventories
        id: update
        run: |
          args=()
          [ -f data/acs_articles.json ] && args+=(--acs-file data/acs_articles.json)
          [ -f data/science_articles.json ] && args+=(--science-file data/science_articles.json)
          [ -f data/nature_communications_articles.json ] && args+=(--nature-file data/nature_communications_articles.json)
          [ -f data/jctc_articles.json ] && args+=(--jctc-file data/jctc_articles.json)
          [ -f data/jcim_articles.json ] && args+=(--jcim-file data/jcim_articles.json)
          [ -f data/jcc_articles.json ] && args+=(--jcc-file data/jcc_articles.json)
          [ -f data/angew_articles.json ] && args+=(--angew-file data/angew_articles.json)
          [ -f data/chemical_science_articles.json ] && args+=(--chemical-science-file data/chemical_science_articles.json)
          python scripts/update_journals.py "${args[@]}"

      - name: Commit updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/seen_dois.json
          if [ -f data/acs_articles.json ]; then git add data/acs_articles.json; fi
          if [ -f data/science_articles.json ]; then git add data/science_articles.json; fi
          for inventory in data/nature_communications_articles.json data/jctc_articles.json data/jcim_articles.json data/jcc_articles.json data/angew_articles.json data/chemical_science_articles.json; do
            if [ -f "$inventory" ]; then git add "$inventory"; fi
          done
          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "Update journal metadata"
            git push
          fi

      - name: Create notification issue
        if: steps.update.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.update.outputs.new_count }}
          CHECKED_DATE: ${{ steps.update.outputs.checked_date }}
        run: gh issue create --title "신규 논문 ${NEW_COUNT}편 · ${CHECKED_DATE}" --body-file data/new_articles.md

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          mkdir _site/data
          cp data/articles.json _site/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
